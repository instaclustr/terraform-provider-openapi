swagger: "2.0"
host: %s
schemes:
  - "http"

paths:
  /v1/cdns:
    x-terraform-resource-name: "cdn"
    post:
      summary: "Create cdn"
      operationId: "ContentDeliveryNetworkCreateV1"
      parameters:
        - in: "body"
          name: "body"
          description: "Created CDN"
          required: true
          schema:
            $ref: "#/definitions/ContentDeliveryNetworkV1"
      responses:
        201:
          description: "successful operation"
          schema:
            $ref: "#/definitions/ContentDeliveryNetworkV1"
  /v1/cdns/{cdn_id}:
    get:
      summary: "Get cdn by id"
      operationId: "ContentDeliveryNetworkGetV1"
      parameters:
        - name: "cdn_id"
          in: "path"
          required: true
          type: "string"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/ContentDeliveryNetworkV1"
    put:
      summary: "Update cdn"
      operationId: "ContentDeliveryNetworkUpdateV1"
      parameters:
        - name: "cdn_id"
          in: "path"
          required: true
          type: "string"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/ContentDeliveryNetworkV1"
      responses:
        200:
          description: "successful operation"
          schema:
            $ref: "#/definitions/ContentDeliveryNetworkV1"
    delete:
      summary: "Delete cdn"
      operationId: "ContentDeliveryNetworkDeleteV1"
      parameters:
        - name: "cdn_id"
          in: "path"
          required: true
          type: "string"
      responses:
        204:
          description: "successful operation"
definitions:
  ContentDeliveryNetworkV1:
    type: "object"
    required:
      - label
    properties:
      id:
        type: "string"
        readOnly: true
      label:
        type: "string"
      settings:
        type: "object"
        properties:
          size:
            type: "string"
          region:
            type: "string"
